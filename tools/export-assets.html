<!doctype html><body><script type="module">
// Exporta todos os sprites atuais como PNG (tamanho original), para servir de referência de arte.
import { buildArt, buildFloor, THEMES } from '../src/game/art.js';
const A = buildArt();
const out = {};
const put = (name, c) => (out[name] = { url: c.toDataURL('image/png'), w: c.width, h: c.height });
put('player/player_idle_0.png', A.player[0]); put('player/player_idle_1.png', A.player[1]);
put('player/portrait.png', A.portrait);
const enemies = ['spider', 'bat', 'mite', 'brute', 'spitter', 'slime', 'slimelet', 'crab', 'rat', 'ghost', 'moth', 'bomber', 'wasp'];
for (const k of enemies) A[k].frames.forEach((c, i) => put(`enemies/${k}_${i}.png`, c));
const bosses = { boss: 'boss_queen', bossToad: 'boss_toad', bossGolem: 'boss_golem', bossMother: 'boss_mother', bossMutant: 'boss_mutant' };
for (const [k, n] of Object.entries(bosses)) A[k].frames.forEach((c, i) => put(`bosses/${n}_${i}.png`, c));
A.drone.forEach((c, i) => put(`weapons/drone_${i}.png`, c));
A.saw.forEach((c, i) => put(`weapons/saw_${i}.png`, c));
put('ui/heart_full.png', A.heart); put('ui/heart_empty.png', A.heartEmpty);
put('pickups/gem_small.png', A.gem); put('pickups/gem_big.png', A.gemBig);
for (const th of Object.keys(THEMES)) put(`backgrounds/floor_${th}.png`, buildFloor(180, 390, 11, 60, 197, th));
window.__out = out;
</script></body>
