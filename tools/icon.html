<!doctype html><body style="margin:0;background:#000"><script type="module">
// Gera ícone e splash a partir da arte do jogo
import { buildArt, buildFloor } from '../src/game/art.js';
import { drawText } from '../src/engine/font.js';
const A = buildArt();
function icon(withBg, fg = true) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  if (withBg) { x.drawImage(buildFloor(64, 64, 5, 0, 32), 0, 0); x.fillStyle = 'rgba(18,14,22,.35)'; x.fillRect(0,0,64,64); }
  if (fg) {
    x.drawImage(A.spider.frames[0], 2, 4); x.drawImage(A.bat.frames[0], 40, 8);
    x.drawImage(A.player[0], 20, 20, 24, 35);
    x.drawImage(A.drone[0], 8, 40); x.drawImage(A.drone[0], 46, 38);
    x.fillStyle = '#e2fbff'; for (let i = 0; i < 9; i++) x.fillRect(13 + i, 39 - i, 1, 1);
  }
  return c;
}
function up(c, s) { const o = document.createElement('canvas'); o.width = c.width * s; o.height = c.height * s; const x = o.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/png'); }
function splash() {
  const c = document.createElement('canvas'); c.width = 170; c.height = 170;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.fillStyle = '#120e16'; x.fillRect(0, 0, 170, 170);
  x.drawImage(A.player[0], 69, 40, 32, 46);
  drawText(x, 'ULTIMO', 85, 98, '#e8e2d0', { align: 'center', scale: 3 });
  drawText(x, 'POSTO', 85, 118, '#ff8a3a', { align: 'center', scale: 3 });
  return c;
}
const bgOnly = document.createElement('canvas'); bgOnly.width = 64; bgOnly.height = 64;
bgOnly.getContext('2d').drawImage(icon(true, false), 0, 0);
const fgPad = document.createElement('canvas'); fgPad.width = 64; fgPad.height = 64;
{ const x = fgPad.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(icon(false), 11, 11, 42, 42); } // zona segura do ícone adaptativo
window.__out = { 'icon-only.png': up(icon(true), 16), 'icon-foreground.png': up(fgPad, 16), 'icon-background.png': up(bgOnly, 16), 'splash.png': up(splash(), 16), 'splash-dark.png': up(splash(), 16) };
</script></body>
