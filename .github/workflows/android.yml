# Gera o app Android na nuvem (GitHub Actions) — só quando pedido:
# - Botão "Run workflow" na aba Actions (ou o Claude dispara quando você pedir)
# - Tag "v1.0.0": versão para a Play Store
name: Android build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # para publicar o APK em Releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android a partir do game.config.js
        run: npm run android:init

      - name: Preparar chave de assinatura
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV

      - name: Compilar APK (teste) e AAB (loja)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apk-teste
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: aab-play-store
          path: android/app/build/outputs/bundle/release/*.aab

      # APK de teste em Releases: no celular, abra github.com/RenanTCastro/ultimo-posto/releases/latest e toque no .apk
      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk siege-of-darkness-teste.apk

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste-${{ github.run_number }}
          name: APK de teste #${{ github.run_number }}
          body: |
            Build de teste (anúncios de TESTE do Google). Para instalar no Android: toque em siege-of-darkness-teste.apk e permita "instalar apps desconhecidos".
            Commit: ${{ github.sha }}
          files: siege-of-darkness-teste.apk
          make_latest: true
